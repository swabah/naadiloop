name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: naadi
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naadi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naadi
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/naadi
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      GEMINI_API_KEY: ci-placeholder-not-used-by-smoke-tests
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SUPER_ADMIN_EMAIL: superadmin@naadi.demo
      SUPER_ADMIN_PASSWORD: ci-super-admin-password
      ALLOW_DEMO_SMOKE_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build
      - name: Migration and API smoke test
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm --filter @naadi/server start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3001/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3001/ready
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data '{"json":{"email":"superadmin@naadi.demo","password":"ci-super-admin-password"}}' \
            http://localhost:3001/trpc/auth.login
          pnpm --filter @naadi/api smoke:uhid
